<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de Loïs</title>
<meta name="description" content="Emploi du temps de Loïs, ITEEM à Centrale Lille, mis à jour toutes les heures.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F2F4F1;
  --surface: #FFFFFF;
  --ink: #1C2430;
  --muted: #5E6873;
  --line: #D6DBD4;
  --accent: #2446C9;
  --now: #D0342C;
  --hour: 56px;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15191E; --surface: #1E242B; --ink: #E8ECEF; --muted: #9AA4AE;
    --line: #2C333B; --accent: #8FA6FF; --now: #FF6B61;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15191E; --surface: #1E242B; --ink: #E8ECEF; --muted: #9AA4AE;
  --line: #2C333B; --accent: #8FA6FF; --now: #FF6B61;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body);
  padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { max-width: 1200px; margin: 0 auto; padding: 24px 20px 14px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
h1 { font: 700 clamp(28px, 6vw, 46px)/1 var(--display); letter-spacing: -0.025em; margin: 0; }
.sub { margin: 8px 0 0; color: var(--muted); }

.bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.bar button {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; cursor: pointer; min-height: 40px;
}
.bar button:hover { border-color: var(--accent); }
.range { font: 500 17px var(--display); min-width: 14ch; text-align: center; text-transform: capitalize; }

main { max-width: 1200px; margin: 0 auto; padding: 0 20px 32px; }

.tabs { display: none; gap: 4px; margin-bottom: 10px; overflow-x: auto; }
.tabs button { flex: 1; min-width: 46px; padding: 6px 4px; border: 1px solid transparent; border-radius: 8px; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.tabs button span { font-size: 12px; color: var(--muted); }
.tabs button strong { font: 700 18px var(--display); }
.tabs button[aria-selected="true"] { background: var(--surface); border-color: var(--line); }
.tabs button.is-today strong { color: var(--accent); }
.tabs[hidden] { display: none; }

.grid { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.grid.week { grid-template-columns: 44px repeat(var(--days, 5), minmax(0, 1fr)); }
.corner, .dayhead { grid-row: 1; border-bottom: 1px solid var(--line); }
.corner { grid-column: 1; }
.times, .col { grid-row: 2; }
.dayhead { padding: 10px 8px 8px; border-left: 1px solid var(--line); min-width: 0; }
.dayhead .wd { color: var(--muted); text-transform: capitalize; }
.dayhead .num { font: 700 20px var(--display); margin-left: 4px; padding: 0 6px; border-radius: 6px; }
.dayhead.today .num { background: var(--accent); color: var(--surface); }
.allday { display: block; width: 100%; margin-top: 6px; text-align: left; cursor: pointer; border: 0; border-radius: 6px; padding: 3px 6px; font-size: 12px; background: color-mix(in srgb, var(--c) 22%, var(--surface)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.times { position: relative; }
.times span { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(2px); }
.col { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--hour)); }
.col.today { background-color: color-mix(in srgb, var(--accent) 5%, transparent); }

.ev { position: absolute; overflow: hidden; cursor: pointer; text-align: left; border: 0; border-left: 4px solid var(--c); border-radius: 6px; padding: 4px 6px; background: color-mix(in srgb, var(--c) 15%, var(--surface)); font-size: 12.5px; line-height: 1.25; }
.ev:hover { background: color-mix(in srgb, var(--c) 25%, var(--surface)); }
.ev b { display: block; font-weight: 700; overflow-wrap: break-word; hyphens: auto; }
.ev span { display: block; color: var(--muted); }
.ev.past { opacity: .55; }

.now { position: absolute; left: 0; right: 0; height: 2px; background: var(--now); z-index: 2; pointer-events: none; }
.now::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }

.grid.month { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.mh { padding: 8px 6px; font-size: 12px; color: var(--muted); text-transform: capitalize; border-bottom: 1px solid var(--line); text-align: center; }
.cell { display: flex; flex-direction: column; gap: 2px; align-items: stretch; min-height: 96px; padding: 6px 5px; cursor: pointer; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.cell:nth-child(7n + 1) { border-left: 0; }
.cell:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.cell.out { opacity: .4; }
.cell .n { font: 700 15px var(--display); align-self: flex-start; padding: 1px 6px; border-radius: 6px; }
.cell.today .n { background: var(--accent); color: var(--surface); }
.chip { font-size: 11px; line-height: 1.3; padding: 1px 5px; border-radius: 4px; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 15%, var(--surface)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.more { font-size: 11px; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.dots { display: flex; gap: 3px; flex-wrap: wrap; }

.notice { margin: 16px 0; padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.notice[hidden] { display: none; }
footer { max-width: 1200px; margin: 0 auto; padding: 0 20px 32px; color: var(--muted); font-size: 13px; }

dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(440px, calc(100% - 32px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgb(0 0 0 / .35); }
.dlg { padding: 20px 22px 18px; border-top: 6px solid var(--c, var(--accent)); }
.dlg h2 { font: 700 22px/1.15 var(--display); margin: 0 0 10px; letter-spacing: -.01em; }
.dlg p { margin: 4px 0; }
.dlg .desc { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); }
.dlg .close { margin-top: 16px; width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--paper); }

@media (max-width: 700px) {
  header { padding: 18px 16px 10px; }
  .bar { width: 100%; }
  .range { order: -1; flex-basis: 100%; min-width: 0; text-align: left; font: 500 21px var(--display); }
  .bar button { flex: 1 1 auto; padding: 8px 10px; }
  #prev, #next { flex: 0 0 44px; }
  main { padding: 0 12px 24px; }
  .tabs { display: flex; }
  .grid.week .dayhead, .grid.week .corner { display: none; }
  .grid.week .dayhead.has-allday, .grid.week:has(.has-allday) .corner { display: block; }
  .cell { min-height: 58px; padding: 4px 3px; }
  .cell .n { font-size: 13px; padding: 0 4px; }
}
@media (prefers-reduced-motion: no-preference) {
  dialog[open] { animation: pop .16s ease-out; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Agenda de Loïs</h1>
    <p class="sub">Emploi du temps ITEEM, Centrale Lille</p>
  </div>
  <nav class="bar" aria-label="Navigation">
    <button id="prev" aria-label="Précédent">‹</button>
    <span class="range" id="range" aria-live="polite"></span>
    <button id="next" aria-label="Suivant">›</button>
    <button id="today">Aujourd'hui</button>
    <button id="view">Mois</button>
    <button id="theme" aria-label="Thème">Thème : auto</button>
  </nav>
</header>

<main>
  <div class="tabs" id="tabs" role="tablist" aria-label="Jour"></div>
  <p class="notice" id="notice" hidden></p>
  <div class="grid week" id="grid"></div>
</main>

<footer id="updated"></footer>

<dialog id="dlg">
  <div class="dlg">
    <h2 id="d-title"></h2>
    <p id="d-when"></p>
    <p id="d-where"></p>
    <div class="desc" id="d-desc"></div>
    <button class="close" id="d-close">Fermer</button>
  </div>
</dialog>

<script>
const TZ = "Europe/Paris";
const HOUR = 56;
const PALETTE = ["#2F7D6D", "#B5562E", "#6A4FB3", "#2E6DB4", "#A1812A", "#B03A67", "#4E7F2E", "#3B8A9E"];

const $ = (id) => document.getElementById(id);
const grid = $("grid"), tabs = $("tabs"), notice = $("notice");
const mobile = matchMedia("(max-width: 700px)");

const partsFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const wdFmt = new Intl.DateTimeFormat("fr-FR", { weekday: "short", timeZone: "UTC" });
const wdNarrow = new Intl.DateTimeFormat("fr-FR", { weekday: "narrow", timeZone: "UTC" });
const longFmt = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
const rangeFmt = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", timeZone: "UTC" });
const monthFmt = new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric", timeZone: "UTC" });
const updFmt = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", timeZone: TZ });

function paris(d) {
  const p = Object.fromEntries(partsFmt.formatToParts(d).map((x) => [x.type, x.value]));
  return { key: `${p.year}-${p.month}-${p.day}`, min: +p.hour * 60 + +p.minute };
}
const keyDate = (k) => new Date(k + "T12:00:00Z");
function addDays(k, n) { const d = keyDate(k); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function addMonths(k, n) { const d = keyDate(k); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 10); }
function mondayOf(k) { return addDays(k, -((keyDate(k).getUTCDay() + 6) % 7)); }
const hm = (m) => `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; }
const courseKey = (t) => t.split(/\s[-–]\s|\(/)[0].trim().toLowerCase();

let EVENTS = [];
let view = "week";
let weekStart = mondayOf(paris(new Date()).key);
let monthStart = paris(new Date()).key.slice(0, 8) + "01";
let selected = null;

/* ---------- thème ---------- */
const THEMES = ["auto", "light", "dark"];
const LABEL = { auto: "Thème : auto", light: "Thème : clair", dark: "Thème : sombre" };
let theme = localStorage.getItem("theme") || "auto";
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("theme").textContent = LABEL[theme];
  localStorage.setItem("theme", theme);
}
$("theme").onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(); };
applyTheme();

/* ---------- vue semaine ---------- */
function weekDays() {
  const days = [0, 1, 2, 3, 4].map((i) => addDays(weekStart, i));
  for (const i of [5, 6]) {
    const k = addDays(weekStart, i);
    if (EVENTS.some((e) => e.key === k)) days.push(k);
  }
  return days;
}

function layout(list, h0, nowKey, nowMin) {
  list = [...list].sort((a, b) => a.sm - b.sm || b.em - a.em);
  let html = "", cluster = [], end = -1;
  const flush = () => {
    const cols = [];
    for (const e of cluster) {
      let i = cols.findIndex((c) => c <= e.sm);
      if (i < 0) { i = cols.length; cols.push(0); }
      cols[i] = e.em; e._c = i;
    }
    const n = cols.length;
    for (const e of cluster) {
      const top = (e.sm - h0 * 60) / 60 * HOUR;
      const height = Math.max((e.em - e.sm) / 60 * HOUR - 2, 22);
      const past = e.key < nowKey || (e.key === nowKey && e.em <= nowMin);
      html += `<button class="ev${past ? " past" : ""}" data-i="${e.i}" style="--c:${e.color};top:${top}px;height:${height}px;left:calc(${(e._c / n) * 100}% + 3px);width:calc(${100 / n}% - 6px)">`
        + `<b>${esc(e.title)}</b><span>${hm(e.sm)}–${hm(e.em)}</span>${e.location ? `<span>${esc(e.location)}</span>` : ""}</button>`;
    }
    cluster = [];
  };
  for (const e of list) {
    if (cluster.length && e.sm >= end) { flush(); end = -1; }
    cluster.push(e); end = Math.max(end, e.em);
  }
  if (cluster.length) flush();
  return html;
}

function renderWeek(now) {
  const days = weekDays();
  if (!days.includes(selected)) selected = days.includes(now.key) ? now.key : days[0];
  const shown = mobile.matches ? [selected] : days;

  const last = keyDate(days[days.length - 1]);
  $("range").textContent = rangeFmt.formatRange ? rangeFmt.formatRange(keyDate(days[0]), last) : `${rangeFmt.format(keyDate(days[0]))} – ${rangeFmt.format(last)}`;

  tabs.hidden = !mobile.matches;
  tabs.innerHTML = days.map((k) =>
    `<button role="tab" aria-selected="${k === selected}" data-k="${k}" class="${k === now.key ? "is-today" : ""}"><span>${wdFmt.format(keyDate(k))}</span><strong>${keyDate(k).getUTCDate()}</strong></button>`
  ).join("");

  const timed = EVENTS.filter((e) => !e.allDay && shown.includes(e.key));
  let h0 = 8, h1 = 18;
  for (const e of timed) { h0 = Math.min(h0, Math.floor(e.sm / 60)); h1 = Math.max(h1, Math.ceil(e.em / 60)); }
  const colH = (h1 - h0) * HOUR;

  let html = `<div class="corner"></div>`;
  for (const k of shown) {
    const ad = EVENTS.filter((e) => e.allDay && e.key === k);
    html += `<div class="dayhead${k === now.key ? " today" : ""}${ad.length ? " has-allday" : ""}"><span class="wd">${wdFmt.format(keyDate(k))}</span><span class="num">${keyDate(k).getUTCDate()}</span>`
      + ad.map((e) => `<button class="allday" data-i="${e.i}" style="--c:${e.color}">${esc(e.title)}</button>`).join("") + `</div>`;
  }
  html += `<div class="times" style="height:${colH}px">`;
  for (let h = h0; h < h1; h++) html += `<span style="top:${(h - h0) * HOUR}px">${h}h</span>`;
  html += `</div>`;
  for (const k of shown) {
    html += `<div class="col${k === now.key ? " today" : ""}" style="height:${colH}px">` + layout(timed.filter((e) => e.key === k), h0, now.key, now.min);
    if (k === now.key && now.min >= h0 * 60 && now.min <= h1 * 60)
      html += `<div class="now" style="top:${(now.min - h0 * 60) / 60 * HOUR}px" aria-hidden="true"></div>`;
    html += `</div>`;
  }
  grid.className = "grid week";
  grid.style.setProperty("--days", shown.length);
  grid.innerHTML = html;

  if (!notice.dataset.error) {
    notice.hidden = EVENTS.some((e) => shown.includes(e.key));
    notice.textContent = mobile.matches ? "Pas de cours ce jour-là." : "Pas de cours cette semaine.";
  }
}

/* ---------- vue mois ---------- */
function renderMonth(now) {
  $("range").textContent = monthFmt.format(keyDate(monthStart));
  tabs.hidden = true;

  const month = monthStart.slice(0, 7);
  const first = mondayOf(monthStart);
  const compact = mobile.matches;
  const fmt = compact ? wdNarrow : wdFmt;

  let html = "";
  for (let i = 0; i < 7; i++) html += `<div class="mh">${fmt.format(keyDate(addDays(first, i)))}</div>`;

  let weeks = 6;
  const lastKey = addDays(addMonths(monthStart, 1), -1);
  if (Math.round((keyDate(lastKey) - keyDate(first)) / 864e5) < 35) weeks = 5;

  for (let i = 0; i < weeks * 7; i++) {
    const k = addDays(first, i);
    const evs = EVENTS.filter((e) => e.key === k).sort((a, b) => a.sm - b.sm);
    const out = !k.startsWith(month) ? " out" : "";
    html += `<button class="cell${out}${k === now.key ? " today" : ""}" data-k="${k}"><span class="n">${keyDate(k).getUTCDate()}</span>`;
    if (compact) {
      html += `<span class="dots">` + evs.slice(0, 4).map((e) => `<span class="dot" style="--c:${e.color}"></span>`).join("") + `</span>`;
    } else {
      html += evs.slice(0, 3).map((e) => `<span class="chip" style="--c:${e.color}">${e.allDay ? "" : hm(e.sm) + " "}${esc(e.title)}</span>`).join("");
      if (evs.length > 3) html += `<span class="more">+${evs.length - 3}</span>`;
    }
    html += `</button>`;
  }
  grid.className = "grid month";
  grid.innerHTML = html;

  if (!notice.dataset.error) {
    notice.hidden = EVENTS.some((e) => e.key.startsWith(month));
    notice.textContent = "Pas de cours ce mois-ci.";
  }
}

function render() {
  const now = paris(new Date());
  $("view").textContent = view === "week" ? "Mois" : "Semaine";
  if (view === "week") renderWeek(now); else renderMonth(now);
}

/* ---------- interactions ---------- */
function openDetail(i) {
  const e = EVENTS[i];
  $("dlg").querySelector(".dlg").style.setProperty("--c", e.color);
  $("d-title").textContent = e.title;
  const day = longFmt.format(keyDate(e.key));
  $("d-when").textContent = e.allDay ? `${day}, toute la journée` : `${day}, ${hm(e.sm)}–${hm(e.em)}`;
  $("d-where").textContent = e.location ? `Salle : ${e.location}` : "";
  const desc = $("d-desc");
  desc.replaceChildren(...e.description.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
    const p = document.createElement("p"); p.textContent = l; return p;
  }));
  desc.hidden = !desc.childElementCount;
  $("dlg").showModal();
}

function goToDay(k) {
  view = "week"; selected = k; weekStart = mondayOf(k); monthStart = k.slice(0, 8) + "01"; render();
}

grid.addEventListener("click", (ev) => {
  const evBtn = ev.target.closest("[data-i]");
  if (evBtn) return openDetail(+evBtn.dataset.i);
  const cell = ev.target.closest("[data-k]");
  if (cell) goToDay(cell.dataset.k);
});
tabs.addEventListener("click", (ev) => { const b = ev.target.closest("[data-k]"); if (b) { selected = b.dataset.k; render(); } });
$("prev").onclick = () => { if (view === "week") { weekStart = addDays(weekStart, -7); selected = null; } else monthStart = addMonths(monthStart, -1); render(); };
$("next").onclick = () => { if (view === "week") { weekStart = addDays(weekStart, 7); selected = null; } else monthStart = addMonths(monthStart, 1); render(); };
$("today").onclick = () => { const k = paris(new Date()).key; weekStart = mondayOf(k); monthStart = k.slice(0, 8) + "01"; selected = k; render(); };
$("view").onclick = () => {
  if (view === "week") { monthStart = (selected || weekStart).slice(0, 8) + "01"; view = "month"; }
  else { const k = selected && selected.startsWith(monthStart.slice(0, 7)) ? selected : monthStart; weekStart = mondayOf(k); selected = k; view = "week"; }
  render();
};
$("d-close").onclick = () => $("dlg").close();
$("dlg").addEventListener("click", (ev) => { if (ev.target === $("dlg")) $("dlg").close(); });
document.addEventListener("keydown", (ev) => {
  if ($("dlg").open) return;
  if (ev.key === "ArrowLeft") $("prev").click();
  if (ev.key === "ArrowRight") $("next").click();
});
mobile.addEventListener("change", render);
setInterval(render, 60_000);

/* ---------- données ---------- */
(async () => {
  try {
    const r = await fetch("data/events.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    EVENTS = data.events.map((e, i) => {
      const s = paris(new Date(e.start)), en = paris(new Date(e.end));
      return { ...e, i, key: s.key, sm: s.min, em: en.key === s.key ? en.min : 24 * 60, color: PALETTE[hash(courseKey(e.title)) % PALETTE.length] };
    });
    if (data.updated) $("updated").textContent = `Synchronisé avec HyperPlanning toutes les heures. Dernière modification le ${updFmt.format(new Date(data.updated))}.`;
    else { notice.dataset.error = "1"; notice.hidden = false; notice.textContent = "L'agenda n'a pas encore été récupéré. Lance l'action « Mettre à jour l'agenda » dans l'onglet Actions du dépôt GitHub."; }
    const today = paris(new Date()).key, wd = (keyDate(today).getUTCDay() + 6) % 7;
    if (wd >= 5 && !EVENTS.some((e) => e.key >= today && e.key < addDays(weekStart, 7))) weekStart = addDays(weekStart, 7);
  } catch (err) {
    notice.dataset.error = "1"; notice.hidden = false;
    notice.textContent = "Impossible de charger data/events.json. Vérifie que l'action GitHub « Mettre à jour l'agenda » s'est bien terminée, puis recharge la page.";
  }
  render();
})();
</script>
</body>
</html>
